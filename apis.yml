name: Simpo
description: >-
  Simpo is a no-code digital adoption platform (DAP) that lets enterprise
  product and customer-success teams build in-app onboarding flows, guided
  walkthroughs, announcements, surveys, and contextual help without writing
  code. End users are guided at the point of need inside the software they
  already use, driving feature adoption, engagement, and retention. Founded in
  2016 by Yohanan Hruschev and Yuval Karmi and headquartered in San Francisco,
  Simpo raised a $4.5M seed round led by Redpoint Ventures in 2019 and was
  acquired by WalkMe in October 2021. The product is a snippet/embed-installed
  browser layer rather than a public developer REST API; it exposes no OpenAPI,
  SDK, or public developer documentation surface, and the primary web host is no
  longer reachable following the acquisition.
